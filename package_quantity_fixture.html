<script>
window.expandedTitles = [];
document.querySelectorAll('.panel-title a[data-toggle="collapse"]').forEach(toggle => {
    toggle.onclick = event => {
        event.preventDefault();
        const content = document.getElementById(toggle.getAttribute('href').split('#')[1]);
        document.querySelectorAll('.panel-collapse').forEach(panel => {
            panel.classList.remove('in'); panel.style.height='0px'; panel.setAttribute('aria-expanded','false');
        });
        content.classList.add('in'); content.style.height='auto'; content.setAttribute('aria-expanded','true');
        toggle.classList.remove('collapsed'); toggle.setAttribute('aria-expanded','true');
        expandedTitles.push(toggle.textContent.trim());
    };
});
document.querySelector('#btnDoNext').onclick = event => {
    event.preventDefault();
    const selected = [...document.querySelectorAll('select.form-control-s')].filter(el => Number(el.value) > 0);
    if (selected.length !== 1) return;
    const ticket = selected[0];
    const name = ticket.closest('tr').querySelector('.spName').textContent.trim();
    location.href = '/LiveTicketD4/Seats?count=' + ticket.value + '&product=' + encodeURIComponent(name);
};
