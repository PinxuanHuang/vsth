<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><title>結帳會員登入測試</title>
<body>
<form action="/Member/Login" method="post" id="headerLogin">
    <input type="email" name="UserName" aria-label="Header user">
    <input type="password" name="Password" aria-label="Header password">
    <button type="submit">Header login</button>
</form>
<form action="/LiveTicketD4/Home/VieShowLoginForCheckout" class="form-horizontal text-left" method="post" novalidate="novalidate">
    <input type="hidden" name="__RequestVerificationToken" value="local-fixture-token">
    <div class="form-group has-feedback">
        <label for="inputUserName">帳號*</label>
        <input class="input-validation-error form-control" id="inputUserName" name="UserName" type="email" maxlength="50" required value="">
        <span class="field-validation-error text-danger" data-valmsg-for="UserName">*</span>
    </div>
    <div class="form-group has-feedback">
        <label for="inputPassword">密碼*</label>
        <input class="input-validation-error form-control" id="inputPassword" name="Password" type="password" maxlength="20" required value="">
        <span class="field-validation-error text-danger" data-valmsg-for="Password">*</span>
    </div>
    <button type="submit" id="btnCheckoutLogin">登入</button>
    <a href="https://www.vscinemas.com.tw/Service/">忘記密碼?</a>
</form>
<button type="button" id="payment" onclick="window.paymentClicks=(window.paymentClicks||0)+1">付款</button>
</body></html>
